name: Temporary APK Export

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: temporary-apk-export-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  export-clean-install-apk:
    if: github.event.pull_request.head.ref == 'agent/magicos-resilience-and-backup'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Generate isolated disposable signing key
        shell: pwsh
        env:
          OTPHELPER_TEMP_APK_PASSWORD: temporary-clean-install-apk-2026
        run: |
          ./tools/new-otphelper-signing-key.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/otphelper-temp-signing" `
            -ValidityYears 25 `
            -PasswordEnvironmentVariable OTPHELPER_TEMP_APK_PASSWORD `
            -ConfirmCreate
      - name: Build normal debug APK
        env:
          OTPHELPER_KEYSTORE_PATH: ${{ runner.temp }}/otphelper-temp-signing/otphelper-permanent-signing.jks
          OTPHELPER_KEYSTORE_PASSWORD: temporary-clean-install-apk-2026
          OTPHELPER_KEY_ALIAS: otphelper
          OTPHELPER_KEY_PASSWORD: temporary-clean-install-apk-2026
        run: ./gradlew --no-daemon :app:assembleNormalDebug --stacktrace
      - name: Prepare clearly labelled artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          apk="$(find app/build/outputs/apk/normal/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$apk" && -s "$apk" ]]
          cp "$apk" export/otphelper-magic-clean-install-only.apk
          cp "$RUNNER_TEMP/otphelper-temp-signing/otphelper-signing-certificate-sha256.txt" export/SIGNING_CERT_SHA256.txt
          cat > export/READ-ME-FIRST.txt <<'EOF'
          OTP Helper MagicOS temporary clean-install APK

          This APK is signed with an isolated disposable key generated for this single workflow run.
          It CANNOT update the currently installed old APK because that APK used a different lost key.
          Installing it requires uninstalling the old package first, which deletes app data unless an ADB backup has already succeeded.
          It also cannot receive the later permanent-key release as an in-place update.

          Do not uninstall the current APK merely to test this file.
          Use this artifact only for a deliberate clean-install functional test.
          EOF
          sha256sum export/otphelper-magic-clean-install-only.apk > export/APK_SHA256.txt
          unzip -t export/otphelper-magic-clean-install-only.apk >/dev/null
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          [[ -n "$apksigner_bin" && -x "$apksigner_bin" ]]
          "$apksigner_bin" verify --verbose --print-certs export/otphelper-magic-clean-install-only.apk > export/APKSIGNER_REPORT.txt
      - name: Upload temporary APK
        uses: actions/upload-artifact@v7
        with:
          name: otphelper-magic-clean-install-only-${{ github.event.pull_request.head.sha }}
          path: export
          if-no-files-found: error
          retention-days: 1
