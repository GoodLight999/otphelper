name: Fixed-signed fork release

on:
  release:
    types: [prereleased]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: otphelper-fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Grant execute permission
        run: chmod +x gradlew .github/scripts/*.sh

      - name: Require fixed distribution signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.OTPHELPER_SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OTPHELPER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OTPHELPER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OTPHELPER_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.OTPHELPER_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" \
                || -z "$KEY_PASSWORD" || -z "$CERT_SHA256" ]]; then
            echo "::error::Fork release refused: permanent signing Secrets are incomplete."
            exit 1
          fi

          normalized_cert="$(printf '%s' "$CERT_SHA256" \
            | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$normalized_cert" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::OTPHELPER_SIGNING_CERT_SHA256 is not a 64-hex digest."
            exit 1
          fi

          key_path="$RUNNER_TEMP/otphelper-fixed-signing.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          {
            echo "path=$key_path"
            echo "certificate_sha256=$normalized_cert"
          } >> "$GITHUB_OUTPUT"

      - name: Verify fixed signing keystore
        env:
          OTPHELPER_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          OTPHELPER_KEYSTORE_PASSWORD: ${{ secrets.OTPHELPER_KEYSTORE_PASSWORD }}
          OTPHELPER_KEY_ALIAS: ${{ secrets.OTPHELPER_KEY_ALIAS }}
          OTPHELPER_SIGNING_CERT_SHA256: ${{ secrets.OTPHELPER_SIGNING_CERT_SHA256 }}
        run: .github/scripts/verify-signing-keystore.sh

      - name: Build all fixed-signed APK variants
        env:
          OTPHELPER_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          OTPHELPER_KEYSTORE_PASSWORD: ${{ secrets.OTPHELPER_KEYSTORE_PASSWORD }}
          OTPHELPER_KEY_ALIAS: ${{ secrets.OTPHELPER_KEY_ALIAS }}
          OTPHELPER_KEY_PASSWORD: ${{ secrets.OTPHELPER_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --no-build-cache
          :app:clean
          :app:assembleNormalDebug
          :app:assemblePlayDebug
          :app:assembleNormalRelease
          :app:assemblePlayRelease
          --stacktrace

      - name: Verify APK contents and privacy contracts
        run: .github/scripts/verify-distributed-apks.sh

      - name: Verify every APK certificate
        env:
          OTPHELPER_SIGNING_CERT_SHA256: ${{ secrets.OTPHELPER_SIGNING_CERT_SHA256 }}
        run: .github/scripts/verify-fixed-signing.sh

      - name: Generate release checksums and metadata
        shell: bash
        env:
          CERTIFICATE_SHA256: ${{ steps.signing.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          release_dir="app/build/outputs/fork-release"
          mkdir -p "$release_dir"
          mapfile -t apks < <(find app/build/outputs/apk -type f -path '*/release/*.apk' -print | sort)
          if (( ${#apks[@]} != 2 )); then
            echo "Expected exactly two release APKs, found ${#apks[@]}" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            sha256sum "$apk"
          done | sed 's#  app/build/outputs/apk/.*/#  #' > "$release_dir/SHA256SUMS.txt"
          cat > "$release_dir/release-metadata.json" <<EOF
          {
            "schema": "otphelper.fork-release",
            "version": 1,
            "commit": "${GITHUB_SHA}",
            "certificateSha256": "${CERTIFICATE_SHA256}",
            "distribution": "GoodLight999/otphelper GitHub prerelease only"
          }
          EOF
          cat "$release_dir/SHA256SUMS.txt"
          cat "$release_dir/release-metadata.json"

      - name: Upload fixed-signed release APKs for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: otphelper-fixed-signed-release-apks
          path: |
            app/build/outputs/apk/*/release/*.apk
            app/build/outputs/fork-release/SHA256SUMS.txt
            app/build/outputs/fork-release/release-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Attach fixed-signed APKs to the triggering GitHub prerelease
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "Release event did not provide a tag name" >&2
            exit 1
          fi
          mapfile -t assets < <(
            find app/build/outputs/apk -type f -path '*/release/*.apk' -print | sort
            printf '%s\n' \
              app/build/outputs/fork-release/SHA256SUMS.txt \
              app/build/outputs/fork-release/release-metadata.json
          )
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Confirm fork-only distribution boundary
        run: >-
          echo "Google Play upload is intentionally disabled: this fork uses an independent signing identity and is distributed only through this repository."
