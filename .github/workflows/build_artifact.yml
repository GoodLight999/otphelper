name: Build artifact (fixed-signed release)

# Manual-only production-faithful build. Every installable artifact produced here is signed
# during the Gradle build with the exact same repository-pinned identity as GitHub releases.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Grant execute permission
        run: chmod +x gradlew .github/scripts/*.sh

      - name: Require permanent fork signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.OTPHELPER_SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OTPHELPER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OTPHELPER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OTPHELPER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Artifact build refused: permanent signing Secrets are incomplete."
            exit 1
          fi
          key_path="$RUNNER_TEMP/otphelper-fixed-signing.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Verify permanent signing keystore
        env:
          OTPHELPER_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          OTPHELPER_KEYSTORE_PASSWORD: ${{ secrets.OTPHELPER_KEYSTORE_PASSWORD }}
          OTPHELPER_KEY_ALIAS: ${{ secrets.OTPHELPER_KEY_ALIAS }}
        run: .github/scripts/verify-signing-keystore.sh

      - name: Build normal release APK
        env:
          OTPHELPER_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          OTPHELPER_KEYSTORE_PASSWORD: ${{ secrets.OTPHELPER_KEYSTORE_PASSWORD }}
          OTPHELPER_KEY_ALIAS: ${{ secrets.OTPHELPER_KEY_ALIAS }}
          OTPHELPER_KEY_PASSWORD: ${{ secrets.OTPHELPER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:clean :app:assembleNormalRelease --stacktrace

      - name: Verify APK contents and privacy contracts
        run: .github/scripts/verify-distributed-apks.sh

      - name: Verify APK uses the repository-pinned certificate
        run: .github/scripts/verify-fixed-signing.sh

      - name: Write signing metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs/fork-release
          cert="$(tr -d ':[:space:]' < .github/signing/otphelper-cert-sha256.txt)"
          printf 'certificateSha256=%s\ncommit=%s\n' "$cert" "$GITHUB_SHA" \
            > app/build/outputs/fork-release/SIGNING.txt

      - name: Upload fixed-signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: otphelper-normal-release-fixed-signed-apk
          path: |
            app/build/outputs/apk/normal/release/*.apk
            app/build/outputs/fork-release/SIGNING.txt
          if-no-files-found: error
          retention-days: 30
