name: Android CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission
        run: chmod +x gradlew .github/scripts/*.sh
      - name: Unit tests, lint, debug and release builds
        run: >-
          ./gradlew --no-daemon
          :app:testNormalDebugUnitTest
          :app:testPlayDebugUnitTest
          :app:lintNormalDebug
          :app:lintPlayDebug
          :app:assembleNormalDebug
          :app:assemblePlayDebug
          :app:assembleNormalRelease
          :app:assemblePlayRelease
          --stacktrace
      - name: Verify distributed APK contents
        run: .github/scripts/verify-distributed-apks.sh
      - name: Upload installable debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: otphelper-magic-os-debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-static-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
          retention-days: 30

  emulator-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission
        run: chmod +x gradlew .github/scripts/*.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run service binding and resilience checks
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot-save
          script: .github/scripts/run-emulator-tests.sh
      - name: Upload emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests
            app/build/reports/manual-instrumentation
            app/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 30
