name: Android CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Unit tests, lint, debug and release builds
        run: >-
          ./gradlew --no-daemon
          :app:testNormalDebugUnitTest
          :app:testPlayDebugUnitTest
          :app:lintNormalDebug
          :app:lintPlayDebug
          :app:assembleNormalDebug
          :app:assemblePlayDebug
          :app:assembleNormalRelease
          :app:assemblePlayRelease
          --stacktrace

      - name: Verify APK archives, signatures and merged manifests
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p app/build/reports/apk-inspection
          found=0
          for apk in app/build/outputs/apk/*/debug/*.apk; do
            [ -f "$apk" ] || continue
            found=1
            name="$(basename "$apk")"
            unzip -tq "$apk"
            "$build_tools/apksigner" verify --verbose --print-certs "$apk" \
              > "app/build/reports/apk-inspection/${name}.signature.txt"
            apkanalyzer manifest print "$apk" \
              > "app/build/reports/apk-inspection/${name}.manifest.xml"
            manifest="app/build/reports/apk-inspection/${name}.manifest.xml"
            grep -q 'io.github.jd1378.otphelper.MainActivity' "$manifest"
            grep -q 'io.github.jd1378.otphelper.PersistenceService' "$manifest"
            grep -q 'io.github.jd1378.otphelper.NotificationListener' "$manifest"
            grep -q 'io.github.jd1378.otphelper.AccessibilityNotificationService' "$manifest"
            grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$manifest"
            if grep -q 'excludeFromRecents="true"' "$manifest"; then
              echo "MainActivity is still excluded from Recents in $apk" >&2
              exit 1
            fi
          done
          test "$found" -eq 1

      - name: Upload installable debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: otphelper-magic-os-debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-static-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
          retention-days: 30

  emulator-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 35 resilience instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot-save
          script: ./gradlew --no-daemon :app:connectedNormalDebugAndroidTest --stacktrace

      - name: Upload emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 30
