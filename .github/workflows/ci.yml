name: Android CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
      - name: Validate PowerShell maintenance tools
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path tools -Filter '*.ps1' -Recurse -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if (@($parseErrors).Count -gt 0) {
              Write-Error "PowerShell parse failure: $($_.FullName)"
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) {
            throw 'One or more PowerShell maintenance tools failed syntax validation.'
          }
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Smoke test permanent signing bootstrap
        shell: pwsh
        env:
          OTPHELPER_TEST_SIGNING_PASSWORD: ci-only-signing-smoke-password-2026
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'otphelper-signing-smoke'
          ./tools/new-otphelper-signing-key.ps1 `
            -OutputDirectory $output `
            -ValidityYears 25 `
            -PasswordEnvironmentVariable OTPHELPER_TEST_SIGNING_PASSWORD `
            -ConfirmCreate

          $manifest = Get-Content -LiteralPath (Join-Path $output 'manifest.json') -Raw |
            ConvertFrom-Json
          if ($manifest.schema -ne 'otphelper.signing-bootstrap' -or $manifest.version -ne 1) {
            throw 'Signing bootstrap emitted invalid manifest metadata.'
          }
          if ($manifest.alias -ne 'otphelper') {
            throw 'Signing bootstrap emitted an unexpected key alias.'
          }

          $fingerprint = (Get-Content -LiteralPath (
            Join-Path $output 'otphelper-signing-certificate-sha256.txt'
          ) -Raw).Trim()
          if ($fingerprint -notmatch '^[0-9a-f]{64}$') {
            throw 'Signing bootstrap emitted an invalid certificate SHA-256.'
          }
          if ($manifest.certificateSha256 -ne $fingerprint) {
            throw 'Signing bootstrap manifest fingerprint does not match the fingerprint file.'
          }

          $keystore = Join-Path $output 'otphelper-permanent-signing.jks'
          $encoded = Get-Content -LiteralPath (
            Join-Path $output 'otphelper-signing-keystore-base64.txt'
          ) -Raw
          $decoded = Join-Path $env:RUNNER_TEMP 'otphelper-signing-smoke-decoded.jks'
          [System.IO.File]::WriteAllBytes($decoded, [Convert]::FromBase64String($encoded.Trim()))
          $originalHash = (Get-FileHash -LiteralPath $keystore -Algorithm SHA256).Hash
          $decodedHash = (Get-FileHash -LiteralPath $decoded -Algorithm SHA256).Hash
          if ($originalHash -ne $decodedHash) {
            throw 'Base64 keystore output does not reconstruct the generated JKS.'
          }

          $env:OTPHELPER_KEYTOOL_PASSWORD = $env:OTPHELPER_TEST_SIGNING_PASSWORD
          try {
            & keytool `
              -list `
              -keystore $keystore `
              -alias otphelper `
              -storepass:env OTPHELPER_KEYTOOL_PASSWORD
            if ($LASTEXITCODE -ne 0) {
              throw 'keytool could not reopen the generated JKS.'
            }
          }
          finally {
            Remove-Item Env:OTPHELPER_KEYTOOL_PASSWORD -ErrorAction SilentlyContinue
          }
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission
        run: chmod +x gradlew .github/scripts/*.sh
      - name: Prepare fixed distribution signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.OTPHELPER_SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OTPHELPER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OTPHELPER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OTPHELPER_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.OTPHELPER_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" \
                || -z "$KEY_PASSWORD" || -z "$CERT_SHA256" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Fixed signing secrets are incomplete. CI may test ephemeral builds, but no APK will be distributed."
            exit 0
          fi

          key_path="$RUNNER_TEMP/otphelper-fixed-signing.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"
      - name: Unit tests, lint, debug and release builds
        env:
          OTPHELPER_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          OTPHELPER_KEYSTORE_PASSWORD: ${{ secrets.OTPHELPER_KEYSTORE_PASSWORD }}
          OTPHELPER_KEY_ALIAS: ${{ secrets.OTPHELPER_KEY_ALIAS }}
          OTPHELPER_KEY_PASSWORD: ${{ secrets.OTPHELPER_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon
          :app:testNormalDebugUnitTest
          :app:testPlayDebugUnitTest
          :app:lintNormalDebug
          :app:lintPlayDebug
          :app:assembleNormalDebug
          :app:assemblePlayDebug
          :app:assembleNormalRelease
          :app:assemblePlayRelease
          --stacktrace
      - name: Verify distributed APK contents
        run: .github/scripts/verify-distributed-apks.sh
      - name: Verify fixed signing certificate
        if: steps.signing.outputs.available == 'true'
        env:
          OTPHELPER_SIGNING_CERT_SHA256: ${{ secrets.OTPHELPER_SIGNING_CERT_SHA256 }}
        run: .github/scripts/verify-fixed-signing.sh
      - name: Refuse ephemeral APK distribution
        if: steps.signing.outputs.available != 'true'
        run: >-
          echo "Installable artifact upload intentionally disabled: fixed signing secrets are not configured."
      - name: Upload fixed-signed installable APKs
        if: success() && steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: otphelper-magic-os-fixed-signed-apks
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-static-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
          retention-days: 30

  emulator-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission
        run: chmod +x gradlew .github/scripts/*.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run service binding and resilience checks
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot-save
          script: .github/scripts/run-emulator-tests.sh
      - name: Upload emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests
            app/build/reports/manual-instrumentation
            app/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 30
