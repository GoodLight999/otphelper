name: Android CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
      - name: Validate PowerShell maintenance tools
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path tools,.github/scripts -Filter '*.ps1' -Recurse -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if (@($parseErrors).Count -gt 0) {
              Write-Error "PowerShell parse failure: $($_.FullName)"
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) {
            throw 'One or more PowerShell maintenance tools failed syntax validation.'
          }
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Smoke test permanent signing bootstrap
        shell: pwsh
        run: ./.github/scripts/test-signing-bootstrap.ps1
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Grant execute permission
        run: chmod +x gradlew .github/scripts/*.sh
      - name: Prepare fixed or disposable validation signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.OTPHELPER_SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OTPHELPER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OTPHELPER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OTPHELPER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            key_path="$RUNNER_TEMP/otphelper-signing-smoke/otphelper-permanent-signing.jks"
            if [[ ! -s "$key_path" ]]; then
              echo "::error::Disposable signing smoke-test JKS is missing."
              exit 1
            fi
            {
              echo "available=false"
              echo "path=$key_path"
              echo "using_disposable=true"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Permanent signing Secrets are incomplete. Validation APKs use a disposable CI-only key and remain non-distributable."
            exit 0
          fi

          key_path="$RUNNER_TEMP/otphelper-fixed-signing.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          {
            echo "available=true"
            echo "path=$key_path"
            echo "using_disposable=false"
          } >> "$GITHUB_OUTPUT"
      - name: Verify fixed signing keystore
        if: steps.signing.outputs.available == 'true'
        env:
          OTPHELPER_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          OTPHELPER_KEYSTORE_PASSWORD: ${{ secrets.OTPHELPER_KEYSTORE_PASSWORD }}
          OTPHELPER_KEY_ALIAS: ${{ secrets.OTPHELPER_KEY_ALIAS }}
        run: .github/scripts/verify-signing-keystore.sh
      - name: Unit tests, lint, debug and release builds
        env:
          OTPHELPER_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          OTPHELPER_KEYSTORE_PASSWORD: ${{ secrets.OTPHELPER_KEYSTORE_PASSWORD || 'ci-only-signing-smoke-password-2026' }}
          OTPHELPER_KEY_ALIAS: ${{ secrets.OTPHELPER_KEY_ALIAS || 'otphelper' }}
          OTPHELPER_KEY_PASSWORD: ${{ secrets.OTPHELPER_KEY_PASSWORD || 'ci-only-signing-smoke-password-2026' }}
        run: >-
          ./gradlew --no-daemon
          :app:testNormalDebugUnitTest
          :app:testPlayDebugUnitTest
          :app:lintNormalDebug
          :app:lintPlayDebug
          :app:assembleNormalDebug
          :app:assemblePlayDebug
          :app:assembleNormalRelease
          :app:assemblePlayRelease
          --stacktrace
      - name: Verify distributed APK contents
        run: .github/scripts/verify-distributed-apks.sh
      - name: Verify fixed signing certificate
        if: steps.signing.outputs.available == 'true'
        run: .github/scripts/verify-fixed-signing.sh
      - name: Refuse disposable APK distribution
        if: always() && steps.signing.outputs.available != 'true'
        run: >-
          echo "Installable artifact upload intentionally disabled: validation APKs use a disposable CI-only signing key."
      - name: Upload fixed-signed installable APKs
        if: success() && steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: otphelper-magic-os-fixed-signed-apks
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-static-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
          retention-days: 30

  emulator-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Grant execute permission
        run: chmod +x gradlew .github/scripts/*.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run service binding and resilience checks
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot-save
          script: .github/scripts/run-emulator-tests.sh
      - name: Upload emulator reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests
            app/build/reports/manual-instrumentation
            app/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 30
