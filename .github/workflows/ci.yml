name: Android CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Unit tests, lint, debug and release builds
        run: >-
          ./gradlew --no-daemon
          :app:testNormalDebugUnitTest
          :app:testPlayDebugUnitTest
          :app:lintNormalDebug
          :app:lintPlayDebug
          :app:assembleNormalDebug
          :app:assemblePlayDebug
          :app:assembleNormalRelease
          :app:assemblePlayRelease
          --stacktrace

      - name: Verify APK archives, signatures and merged manifests
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apk_analyzer="$(command -v apkanalyzer || true)"
          if [ -z "$apk_analyzer" ]; then
            apk_analyzer="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -perm -u+x | head -n 1)"
          fi
          if [ -z "$apk_analyzer" ] || [ ! -x "$apk_analyzer" ]; then
            echo "Unable to locate apkanalyzer in Android SDK" >&2
            find "$ANDROID_HOME" -maxdepth 5 -name 'apkanalyzer*' -print >&2 || true
            exit 1
          fi

          mkdir -p app/build/reports/apk-inspection
          found=0
          for apk in app/build/outputs/apk/*/debug/*.apk; do
            [ -f "$apk" ] || continue
            found=1
            name="$(basename "$apk")"
            unzip -tq "$apk"
            "$build_tools/apksigner" verify --verbose --print-certs "$apk" \
              > "app/build/reports/apk-inspection/${name}.signature.txt"
            "$apk_analyzer" manifest print "$apk" \
              > "app/build/reports/apk-inspection/${name}.manifest.xml"
            manifest="app/build/reports/apk-inspection/${name}.manifest.xml"
            grep -q 'io.github.jd1378.otphelper.PersistenceService' "$manifest"
            grep -q 'io.github.jd1378.otphelper.NotificationListener' "$manifest"
            grep -q 'rikka.shizuku.ShizukuProvider' "$manifest"
            grep -q 'moe.shizuku.manager.permission.API_V23' "$manifest"
            grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$manifest"
            if grep -qi 'leakcanary\|LeakLauncherActivity\|LeakActivity' "$manifest"; then
              echo "LeakCanary components must not be shipped in $apk" >&2
              exit 1
            fi
            if grep -q 'io.github.jd1378.otphelper.AccessibilityNotificationService' "$manifest"; then
              echo "Obsolete Accessibility notification reader is still packaged in $apk" >&2
              exit 1
            fi
            python3 - "$manifest" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          android = "{http://schemas.android.com/apk/res/android}"
          root = ET.parse(sys.argv[1]).getroot()
          application = root.find("application")
          if application is None:
              raise SystemExit("Merged APK Manifest has no application element")

          main = next(
              (
                  activity
                  for activity in application.findall("activity")
                  if activity.get(android + "name")
                  == "io.github.jd1378.otphelper.MainActivity"
              ),
              None,
          )
          if main is None:
              raise SystemExit("MainActivity is missing from merged APK Manifest")
          if main.get(android + "excludeFromRecents") == "true":
              raise SystemExit("MainActivity is excluded from Recents")

          provider = next(
              (
                  item
                  for item in application.findall("provider")
                  if item.get(android + "name") == "rikka.shizuku.ShizukuProvider"
              ),
              None,
          )
          if provider is None:
              raise SystemExit("ShizukuProvider is missing from merged APK Manifest")
          if provider.get(android + "exported") != "true":
              raise SystemExit("ShizukuProvider must be exported")
          if provider.get(android + "multiprocess") != "false":
              raise SystemExit("ShizukuProvider must use multiprocess=false")
          if provider.get(android + "authorities") != "io.github.jd1378.otphelper.shizuku":
              raise SystemExit("ShizukuProvider authority is incorrect")
          if provider.get(android + "permission") != "android.permission.INTERACT_ACROSS_USERS_FULL":
              raise SystemExit("ShizukuProvider permission is incorrect")
          PY
          done
          test "$found" -eq 1

      - name: Upload installable debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: otphelper-magic-os-debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-static-reports
          path: |
            app/build/reports
            app/build/test-results
          if-no-files-found: ignore
          retention-days: 30

  emulator-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 35 resilience instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-snapshot-save
          script: ./gradlew --no-daemon :app:connectedNormalDebugAndroidTest --stacktrace

      - name: Upload emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 30
